<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>duckiedoll — cozy Twitch streams</title>
    <meta name="description" content="Duckie's cozy, family-friendly Twitch corner: anime talk, drawing, knitting, baking and side quests." />
    <meta name="theme-color" content="#2A1F3D" />
    <!-- link previews (Discord, X, WhatsApp...); %SITE_URL% is filled in by vite.config.ts -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="duckiedoll" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="duckiedoll — cozy Twitch streams" />
    <meta property="og:description" content="Duckie's cozy, family-friendly Twitch corner: anime talk, drawing, knitting, baking and side quests." />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art portrait of Duckie in daisy-covered headphones next to the words: duckiedoll, cozy, family-friendly Twitch streams" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- motion is opt-in: hidden "before" states only apply when this class is set -->
    <script>try{if(matchMedia('(prefers-reduced-motion: no-preference)').matches)document.documentElement.classList.add('js-motion')}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
